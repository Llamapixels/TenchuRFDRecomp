# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# Gameplay camera: scope overrides to original view/projection setup.
[[hook]]
at = 0x002A1929
call = "TenchuCameraBegin"

[[hook]]
at = 0x002A1400
call = "TenchuCameraEnd"

# Xbox Live is gone: the boot-time availability check (0003D940) reports it unusable.
[[hook]]
at = 0x0003D961
call = "TenchuXboxLiveUnavailable"
after = true

# The title menu's Xbox Live item (state 400) reopens the menu list (state 0x0A) instead.
[[hook]]
at = 0x002A6E9B
call = "TenchuBlockXboxLiveMenu"
after = true

# Scene render (00236Axx), split screen when [0x018FE6CC] & 0x04000000: the viewport at [ebp-0x174]
# (x, y, width, height, min z, max z) is 320 wide for player 1, then moved to x 320 for player 2.
# Player 1 full screen widens the first, and the scene pass sub_000139C0 (coop_hooks.cpp) skips
# player 2's; the game's single-screen branch is no use, it leaves the viewport and clears to code
# that split screen skips.
[[hook]]
at = 0x00236AA4
call = "TenchuPlayer1Viewport"

# Player placement (0029FD30, actor at [ebp-8]): split screen jumps to the multiplayer start tables
# (player 1 0x4D9560, player 2 0x4D9690, by stage [0x018E412C] - 10); a clear ZF before this jnz
# keeps the single-player starts (story stages: 0x4D9320 + stage * 0x30 + character * 16).
[[hook]]
at = 0x0029FF1E
call = "TenchuStoryStart"

# Stage loader task (002A4E00): creates player 1, then player 2 when [0x018FE6CC] & 0x04000000
# (002A50A1). Two players for the next mission sets that bit from the loader's first step, so the
# screens before it never see a second player that does not exist (setting it there crashed).
[[hook]]
at = 0x002A4E00
call = "TenchuLoadTwoPlayers"

[[hook]]
at = 0x002A50D2
call = "TenchuTwoPlayersLoaded"

