name: Bug report
description: Something in the game looks, sounds or behaves wrong, stutters, or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Tenchu: Return from Darkness - HoloCatt Recomp Project! Every report shows how far the game really works.
        **Never attach or link game files, disc images or save files**, and no links to copies of the game: issues
        with any of them are removed.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the game window's title bar.
      placeholder: 0.1.4-alpha
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Your PC
      description: Windows version, graphics card and its driver version, CPU.
      placeholder: Windows 11 24H2, RTX 3060 (driver 581.29), Ryzen 5 5600X
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - Crash or freeze
        - Graphics look wrong
        - Sound
        - Controls
        - First start / setup
        - Mods, texture packs or patches
        - Custom levels / RFD Switchblade
        - Other
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game
      description: The mission, menu or cutscene where it happened.
      placeholder: Mission 1, near the gate, at night
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and how to make it happen again
      description: What you expected, what you saw instead, and the steps that lead to it.
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Settings
      description: Renderer (F6 > Display), internal resolution, widescreen, window or fullscreen, mods or texture packs on.
      placeholder: Direct3D 12, 2x, widescreen, 1920x1080 window, no mods
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: Zip the logs folder from the game folder and drag it here. For a crash, add the newest file in CrashDumps. Screenshots or a short video help too.
  - type: checkboxes
    id: legal
    attributes:
      label: Before sending
      options:
        - label: This report contains no game files, disc images, save files or links to copies of the game.
          required: true
